[project]
name = "insta-video-generator"
version = "0.1.0"
description = "Topic in, finished 1-2 minute 3blue1brown-style short out: AI script, Manim animation, local neural voiceover, auto-mixed music, YouTube + Instagram exports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "2min_ai" }]
keywords = ["manim", "tts", "shorts", "reels", "video-generation", "anthropic"]

dependencies = [
    "manim>=0.20",
    "scipy>=1.10",
    "anthropic>=0.40",
    "piper-tts>=1.3",
]

[project.urls]
Repository = "https://github.com/Tunikipranay/insta_video_generator"

[tool.uv]
# no build needed — this is a script-style project, run via `uv run`
package = false
